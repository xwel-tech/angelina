<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Для Ангелины</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marck+Script&family=Inter:wght@400;500&display=swap">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg1:#FFE9DC;--bg2:#FFC9B0;--glow:#FFD98A;--ink:#5B2A4E;--body:#4A2A40;
  --accent:#E8736C;--accent2:#7A3B69;--btnbg:#7A3B69;--btntext:#FFFFFF;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg1:#2A1226;--bg2:#5B2250;--glow:#7A4A2E;--ink:#FFE9DC;--body:#F6D9CF;
    --accent:#FF8F85;--accent2:#FFB4A2;--btnbg:#FFD98A;--btntext:#2A1226;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg1:#2A1226;--bg2:#5B2250;--glow:#7A4A2E;--ink:#FFE9DC;--body:#F6D9CF;
  --accent:#FF8F85;--accent2:#FFB4A2;--btnbg:#FFD98A;--btntext:#2A1226;color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{
  margin:0;height:100%;overflow:hidden;font-family:'Inter',system-ui,sans-serif;color:var(--body);
  background:
    radial-gradient(circle at 18% 12%,var(--bg2),transparent 55%),
    radial-gradient(circle at 85% 92%,var(--glow),transparent 50%),
    var(--bg1);
}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:20}
.bk{position:fixed;border-radius:50%;background:var(--accent);opacity:.14;animation:drift var(--d) ease-in-out infinite alternate;pointer-events:none}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(40px,-60px) scale(1.25)}}

#stage{
  position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:48px;
  padding:env(safe-area-inset-top,0px) 16px env(safe-area-inset-bottom,0px);
  transition:opacity .7s,transform .9s;z-index:5;
}
.env{
  position:relative;display:block;width:min(82vw,380px);aspect-ratio:3/2;border:0;padding:0;background:none;
  cursor:pointer;perspective:1000px;animation:float 3s ease-in-out infinite;font:inherit;
}
.env:focus-visible{outline:3px solid var(--accent2);outline-offset:12px;border-radius:12px}
@keyframes float{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-14px) rotate(1deg)}}
.env span{display:block;position:absolute}
.back{inset:0;background:#F2A98F;border-radius:10px;box-shadow:0 24px 50px rgba(91,42,78,.25)}
.paper{
  left:6%;right:6%;top:6%;bottom:6%;background:#FFFDF9;border-radius:6px;z-index:2;
  display:grid!important;place-items:center;font-family:'Marck Script',cursive;font-size:clamp(26px,7vw,38px);color:#5B2A4E;
  transition:transform .9s .55s cubic-bezier(.3,1.2,.4,1);
}
.front{inset:0;background:#E8736C;border-radius:10px;z-index:4;clip-path:polygon(0 0,50% 54%,100% 0,100% 100%,0 100%)}
.flap{
  left:0;right:0;top:0;height:55%;background:#D9574F;z-index:5;transform-origin:top;
  clip-path:polygon(0 0,100% 0,50% 100%);transition:transform .6s,z-index 0s .3s;
}
.seal{left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;z-index:6;transition:opacity .3s,transform .3s}
.open .env{animation:none}
.open .flap{transform:rotateX(180deg);z-index:1}
.open .paper{transform:translateY(-64%)}
.open .seal{opacity:0;transform:scale(.4)}
.hint{margin:0;font-size:18px;letter-spacing:.06em;color:var(--accent2);animation:pulse 1.8s ease-in-out infinite;transition:opacity .3s}
.open .hint{opacity:0;animation:none}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
.reveal #stage{opacity:0;transform:scale(1.25);pointer-events:none}

#card{
  position:fixed;inset:0;z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(12px,3vh,28px);
  padding:calc(24px + env(safe-area-inset-top,0px)) 24px calc(24px + env(safe-area-inset-bottom,0px));text-align:center;
  opacity:0;visibility:hidden;transform:scale(.9);transition:opacity .9s,transform .9s,visibility 0s .9s;
}
.reveal #card{opacity:1;visibility:visible;transform:none;transition-delay:0s}
.flower{width:clamp(64px,12vh,110px);height:auto;animation:spin 24s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
h1{
  margin:0;font-family:'Marck Script','Segoe Script',cursive;font-weight:400;font-size:clamp(48px,13vw,150px);line-height:1.1;color:var(--ink);
  animation:glow 3s ease-in-out infinite alternate;
}
@keyframes glow{from{text-shadow:0 0 0 transparent}to{text-shadow:0 0 28px var(--accent)}}
.w{display:inline-block;white-space:nowrap}
.l{display:inline-block;opacity:0;transform:translateY(50px) scale(.5) rotate(-10deg)}
.reveal .l{animation:pop .8s cubic-bezier(.2,1.5,.4,1) forwards;animation-delay:calc(var(--i) * 70ms + .5s)}
@keyframes pop{to{opacity:1;transform:none}}
.msg,.sign{opacity:0;transform:translateY(16px)}
.reveal .msg,.reveal .sign{animation:rise 1s ease forwards}
.reveal .msg{animation-delay:1.8s}
.reveal .sign{animation-delay:2.4s}
.reveal .acts{animation:rise 1s 3s ease forwards}
@keyframes rise{to{opacity:1;transform:none}}
.msg{margin:0;max-width:34ch;font-size:clamp(18px,2.6vw,28px);line-height:1.5}
.sign{margin:0;font-size:clamp(15px,2vw,20px);font-weight:500;letter-spacing:.05em;color:var(--accent2)}
.acts{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;opacity:0;transform:translateY(16px)}
.btn{
  min-height:48px;padding:0 26px;border:0;border-radius:999px;background:var(--btnbg);color:var(--btntext);
  font:500 16px 'Inter',system-ui,sans-serif;cursor:pointer;transition:transform .15s;
}
.btn:hover{transform:scale(1.05)}
.btn:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
@media (prefers-reduced-motion:reduce){
  .env,.flower,h1,.bk,.hint{animation:none}
}
</style>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>

<main id="stage">
  <button class="env" id="env" type="button" aria-label="Открыть открытку">
    <span class="back"></span>
    <span class="paper">Для Ангелины</span>
    <span class="front"></span>
    <span class="flap"></span>
    <svg class="seal" viewBox="0 0 46 46" aria-hidden="true" style="position:absolute"><circle cx="23" cy="23" r="22" fill="#FFD98A"/><path d="M23 33C12 26 12 16 18 14.5c3-.8 5 1 5 3 0-2 2-3.800 5-3 6 1.500 6 11.500-5 18.500z" fill="#B5483F"/></svg>
  </button>
  <p class="hint">Нажми, чтобы открыть</p>
</main>

<section id="card" aria-live="polite">
  <svg class="flower" viewBox="0 0 96 96" aria-hidden="true">
    <g transform="translate(48 48)" fill="var(--accent)">
      <ellipse cy="-26" rx="12" ry="20"/><ellipse cy="-26" rx="12" ry="20" transform="rotate(72)"/>
      <ellipse cy="-26" rx="12" ry="20" transform="rotate(144)"/><ellipse cy="-26" rx="12" ry="20" transform="rotate(216)"/>
      <ellipse cy="-26" rx="12" ry="20" transform="rotate(288)"/><circle r="11" fill="#FFD98A"/>
    </g>
  </svg>
  <h1 id="title" aria-label="Привет, Ангелина!"></h1>
  <p class="msg">Пусть сегодня будет тёплый день, лёгкое настроение и маленькие радости, которые хочется запомнить.</p>
  <p class="sign">Улыбнись, тебе это идёт</p>
  <div class="acts">
    <button class="btn" id="again" type="button">Ещё салют</button>
  </div>
</section>

<script>
(function(){
  var $=function(s){return document.querySelector(s)};
  var body=document.body;
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

  // title letters
  var text='Привет, Ангелина!',h1=$('#title'),n=0,words=text.split(' ');
  words.forEach(function(w,wi){
    var ws=document.createElement('span');ws.className='w';ws.setAttribute('aria-hidden','true');
    Array.from(w).forEach(function(ch){
      var s=document.createElement('span');s.className='l';s.textContent=ch;s.style.setProperty('--i',n++);ws.appendChild(s);
    });
    h1.appendChild(ws);
    if(wi<words.length-1){h1.appendChild(document.createTextNode(' '));n++;}
  });

  // background bokeh
  for(var i=0;i<8;i++){
    var b=document.createElement('div'),sz=60+Math.random()*180;
    b.className='bk';
    b.style.cssText='width:'+sz+'px;height:'+sz+'px;left:'+Math.random()*100+'%;top:'+Math.random()*100+'%;--d:'+(6+Math.random()*8)+'s;animation-delay:-'+Math.random()*6+'s';
    body.insertBefore(b,body.firstChild);
  }

  // particles
  var cv=$('#fx'),ctx=cv.getContext('2d'),W,H,dpr;
  function size(){dpr=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
  addEventListener('resize',size);size();
  var colors=['#E8736C','#FFD98A','#7A3B69','#FFC9B0','#FF9EBB','#8EC9BB'],kinds=['r','c','h'],parts=[];
  function burst(x,y,cnt){
    cnt=reduce?Math.round(cnt/3):cnt;
    for(var i=0;i<cnt;i++){
      var a=Math.random()*Math.PI*2,sp=4+Math.random()*10,L=90+Math.random()*60;
      parts.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-4,g:.22,drag:.985,r:Math.random()*6,vr:(Math.random()-.5)*.4,s:5+Math.random()*8,c:colors[i%colors.length],k:kinds[i%3],life:L,max:L});
    }
  }
  function sparkle(x,y){
    parts.push({x:x,y:y,vx:(Math.random()-.5)*1.5,vy:(Math.random()-.5)*1.5,g:.02,drag:.96,r:0,vr:.1,s:5+Math.random()*6,c:'#FFD98A',k:'s',life:30,max:30});
  }
  function rise(){
    if(document.hidden)return;
    parts.push({x:Math.random()*W,y:H+20,vx:0,vy:-(1+Math.random()*1.5),g:0,drag:1,r:0,vr:0,s:8+Math.random()*14,c:colors[Math.floor(Math.random()*4)],k:'h',life:9999,max:9999,sway:Math.random()*6,a:.6});
  }
  function heart(s){
    ctx.beginPath();ctx.moveTo(0,s*.35);
    ctx.bezierCurveTo(-s*.9,-s*.2,-s*.4,-s*.9,0,-s*.35);
    ctx.bezierCurveTo(s*.4,-s*.9,s*.9,-s*.2,0,s*.35);ctx.fill();
  }
  function draw(){
    ctx.clearRect(0,0,W,H);
    for(var i=parts.length-1;i>=0;i--){
      var p=parts[i];
      p.vx*=p.drag;p.vy+=p.g;p.vy*=p.drag;
      p.x+=p.vx+(p.sway?Math.sin(p.y/40)*p.sway*.3:0);p.y+=p.vy;p.r+=p.vr;p.life--;
      if(p.life<=0||p.y<-40||p.y>H+40){parts.splice(i,1);continue}
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);
      ctx.globalAlpha=Math.min(1,p.life/p.max*2)*(p.a||1);ctx.fillStyle=p.c;
      if(p.k==='r'){ctx.fillRect(-p.s/2,-p.s/3,p.s,p.s*.6)}
      else if(p.k==='c'){ctx.beginPath();ctx.arc(0,0,p.s/2,0,6.283);ctx.fill()}
      else if(p.k==='h'){heart(p.s)}
      else{ctx.beginPath();for(var j=0;j<8;j++){var rr=j%2?p.s*.25:p.s,an=j*Math.PI/4;ctx.lineTo(Math.cos(an)*rr,Math.sin(an)*rr)}ctx.fill()}
      ctx.restore();
    }
    requestAnimationFrame(draw);
  }
  draw();

  function fireworks(){
    burst(W/2,H/2,140);
    setTimeout(function(){burst(W*.2,H*.38,70)},300);
    setTimeout(function(){burst(W*.8,H*.38,70)},550);
    setTimeout(function(){burst(W*.5,H*.2,60)},800);
  }

  var opened=false,revealed=false;
  $('#env').addEventListener('click',function(e){
    if(opened)return;opened=true;
    try{
      var de=document.documentElement;
      if(de.requestFullscreen&&!document.fullscreenElement){var pr=de.requestFullscreen();if(pr&&pr.catch)pr.catch(function(){})}
    }catch(err){}
    body.classList.add('open');
    burst(e.clientX||W/2,e.clientY||H/2,30);
    setTimeout(function(){
      body.classList.add('reveal');revealed=true;
      fireworks();
      setInterval(rise,450);
    },1700);
  });
  $('#again').addEventListener('click',fireworks);
  addEventListener('pointermove',function(e){if(Math.random()<.6)sparkle(e.clientX,e.clientY)});
  addEventListener('pointerdown',function(e){
    if(revealed&&!e.target.closest('button'))burst(e.clientX,e.clientY,40);
  });
})();
</script>
</body>
</html>
